<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="14_card.css">
</head>
<body>
    <div class="container">
    <div class="card">
    <img src="Images/CAMERA.jpg" alt="Product Image">
    <div class="card-content">
      <h2 class="title">DSLR Camera</h2>
      <p class="description">This is a great product that you'll absolutely love for photography and qualirity.</p>
      <p class="price">$49.99</p>
    </div>
    </div>
</body>
</html>
