<!-- 1. Create an HTML page with both an ordered list and an unordered list. 
2. In your CSS file:
o Remove default list markers using list-style-type: none. 
o Customize each list by adding a custom marker or symbol. 
o Change the font color and style for list items. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling List</title>
    <link rel="stylesheet" href="04_Styling-List.css">
</head>
<body>
    <h2>Hobbies</h2>
    <ol>
        <li>Traveling</li>
        <li>Coding</li>
        <li>Photography</li>
    </ol>

    <h2>Skills</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>Wordpress</li>
    </ul>
</body>
</html>
