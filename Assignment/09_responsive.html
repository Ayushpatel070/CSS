<!-- 1. Create an HTML page with a main container containing a header, three content sections, and a footer. 
2. Apply CSS to:
o Make the layout a single column on screens narrower than 768px. 
o Change the layout to two columns for screens wider than 768px. 
o Adjust font sizes and padding at different screen widths.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive web design</title>
    <link rel="stylesheet" href="09_responsive.css">
</head>
<body>
    <div class="container">
        <header class="header">Header Section</header>

        <div class="content">
            <section class="section section1">Content Section 1</section>
            <section class="section section2">Content Section 2</section>
            <section class="section section3">Content Section 3</section>
        </div>

        <footer class="footer">Footer Section</footer>
    </div>
</body>
</html>
