<!-- 1. Create an HTML page with a title and a paragraph. 
2. In a separate CSS file or within <style> tags.
o Set the font size of the title to 24px. 
o Change the font family of the paragraph text to Arial. 
o Set the color of the text to navy. 
o Center-align the title and justify the paragraph text. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Styling using css</title>
    <link rel="stylesheet" href="01_basic_styling.css">
</head>
<body>
    <h1>Hello World!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusamus atque libero, beatae hic blanditiis a delectus tempore. Esse, velit, cupiditate sequi commodi voluptates consectetur tempora ab nesciunt voluptatem illum quod!</p>
</body>
</html>
