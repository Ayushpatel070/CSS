<!-- 1. Create an HTML page with a gallery of 6 images.
2. Apply CSS Grid to:
o Arrange the images in a 3x2 grid layout. 
o Set a gap between the grid items. 
o Adjust the grid to be 2x3 for screens narrower than 600px. 
o Center the entire gallery on the page. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout</title>
    <link rel="stylesheet" href="07_grid.css">
</head>
<body>
    <h1 style="text-align: center;">My Image Gallery</h1>
    
    <div class="container">
        <div class="gallery">
            <img src="Images/image1.jpg" alt="Image" width="200px">
            <img src="Images/image2.jpg" alt="image" width="200px">
            <img src="Images/image3.jpg" alt="image" width="200px">
            <img src="Images/image4.JPG" alt="image" width="200px">
            <img src="Images/image5.jpg" alt="image" width="200px">
            <img src="Images/image6.jpg" alt="image" width="200px">
        </div>
    </div>
    </body>
</html>
